name: Fix ALT UI fallback and bulk CTAs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alt-ui-fallback-fix.yml'
      - 'scripts/patch-alt-ui.py'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply patch
        run: python3 scripts/patch-alt-ui.py

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Commit fixes
        run: |
          git config user.name "Otmane2020"
          git config user.email "61626050+Otmane2020@users.noreply.github.com"
          rm -f .github/workflows/alt-ui-fallback-fix.yml scripts/patch-alt-ui.py
          git add src/components/seo/MinimalMetadataWorkspaces.tsx src/components/seo/HomePageSeo.tsx .github/workflows/alt-ui-fallback-fix.yml scripts/patch-alt-ui.py
          git commit -m "fix: make ALT resilient and expose bulk SEO CTAs"
          git push origin main
