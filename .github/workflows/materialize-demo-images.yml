name: Materialize HD demo screenshots

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-demo-images.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download exact HD demo screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/demo

          curl -fL 'https://media.canva.com/v2/image-resize/format:PNG/height:1086/quality:100/uri:ifs%3A%2F%2FM%2F2443900c-00e3-4cbd-b1ed-a5e90fdb3320/watermark:F/width:1448?csig=AAAAAAAAAAAAAAAAAAAAAKG7s717w7Il7k5SRck__p_XdIpCOXwy6vFtZq87gzp6&exp=1788295484&osig=AAAAAAAAAAAAAAAAAAAAAEn5s3cuFM9S1XdMkf6h3oyW4n0_WE7BDa7D3Eq0CANV&signer=media-rpc&x-canva-quality=thumbnail' -o public/demo/catalogoptimizer-studio.png

          curl -fL 'https://media.canva.com/v2/image-resize/format:PNG/height:1086/quality:100/uri:ifs%3A%2F%2FM%2Faa2cb904-c0f4-4ad5-bcf4-b952ecd11324/watermark:F/width:1448?csig=AAAAAAAAAAAAAAAAAAAAAEzD5_MzXkrTV2xhemwal8AhY4ckwP_ogVmmYIaZRXcT&exp=1788297511&osig=AAAAAAAAAAAAAAAAAAAAAEHz8HL2uZ1QUmZhL1ckqpPm7Q9U4NtLFYMdyd7PNIoW&signer=media-rpc&x-canva-quality=thumbnail' -o public/demo/catalogoptimizer-product.png

          curl -fL 'https://media.canva.com/v2/image-resize/format:JPG/height:1086/quality:100/uri:ifs%3A%2F%2FM%2F52c22950-af8f-47f0-98f5-8b953abf5f20/watermark:F/width:1448?csig=AAAAAAAAAAAAAAAAAAAAADxGJ1txYvsYLOqJXoQny60em20mDv0r46mbUUhZqAIT&exp=1788302151&osig=AAAAAAAAAAAAAAAAAAAAAE0NKlSM8d3SKqC1RoA8yCPqPh-wQmgSIAICf09NWJll&signer=media-rpc&x-canva-quality=thumbnail' -o public/demo/catalogoptimizer-seo.jpg

          file public/demo/catalogoptimizer-studio.png
          file public/demo/catalogoptimizer-product.png
          file public/demo/catalogoptimizer-seo.jpg

      - name: Point landing slider to HD files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/landing/CatalogDemoShowcase.tsx')
          s = p.read_text()
          s = s.replace('/demo/catalogoptimizer-studio.webp', '/demo/catalogoptimizer-studio.png')
          s = s.replace('/demo/catalogoptimizer-product.webp', '/demo/catalogoptimizer-product.png')
          s = s.replace('/demo/catalogoptimizer-seo.webp', '/demo/catalogoptimizer-seo.jpg')
          p.write_text(s)
          PY

      - name: Commit HD screenshots
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/demo/catalogoptimizer-studio.png public/demo/catalogoptimizer-product.png public/demo/catalogoptimizer-seo.jpg src/components/landing/CatalogDemoShowcase.tsx
          git commit -m 'fix(landing): use original HD demo screenshots'
          git push
