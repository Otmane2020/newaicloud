name: Apply product Shopify sync fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-product-shopify-sync-fix.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply guarded patch
        run: python3 scripts/apply_product_shopify_sync_fix.py

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/pages/ProductTitleDescription.tsx \
            src/pages/ProductDetail.tsx \
            src/pages/ProductLanding.tsx \
            src/components/seo/RegenerateLanding.tsx \
            src/components/seo/BulkLandingProgressDialog.tsx \
            src/components/seo/SmartBulkLandingDialog.tsx \
            supabase/functions/sync-seo-to-shopify/index.ts
          git diff --cached --check
          git commit -m "Fix canonical Shopify product-page sync"
          git push origin HEAD:main
