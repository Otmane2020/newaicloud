name: Cloudflare image provider refactor

on:
  push:
    paths:
      - '.github/workflows/cloudflare-image-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace Gemini image generation with Cloudflare
        run: python3 .github/scripts/refactor_cloudflare_images.py

      - name: Show source diff
        run: git diff -- supabase/functions

      - name: Commit refactor
        run: |
          git config user.name "Otmane2020"
          git config user.email "61626050+Otmane2020@users.noreply.github.com"
          git add supabase/functions
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "refactor: replace Gemini image generation with Cloudflare"
            git push origin HEAD:main
          fi

      - name: Final Gemini image audit
        run: |
          echo "Searching for Gemini image-generation markers..."
          grep -RniE 'gemini-[^" ]*image|google/gemini-[^" ]*image|GEMINI_IMAGE_MODEL|responseModalities.*IMAGE' supabase/functions || true
