name: Cloudflare image provider refactor

on:
  push:
    paths:
      - '.github/workflows/cloudflare-image-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean creative export handler
        run: python3 .github/scripts/repair_export_creative_cloudflare.py

      - name: Show source diff
        run: git diff -- src supabase/functions

      - name: Commit repair
        run: |
          git config user.name "Otmane2020"
          git config user.email "61626050+Otmane2020@users.noreply.github.com"
          git add src supabase/functions
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "fix: clean Cloudflare creative image export"
            git push origin HEAD:main
          fi

      - name: Audit application code for Gemini image generation
        run: |
          echo "Potential Gemini image-generation markers in application code:"
          grep -RniE --exclude='*.md' --exclude='*.lock' 'gemini-[^" ]*image|google/gemini-[^" ]*image|GEMINI_IMAGE_MODEL|responseModalities.*IMAGE|modalities.*\[.*image' src supabase/functions || true
