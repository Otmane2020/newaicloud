name: Cloudflare image provider refactor

on:
  push:
    paths:
      - '.github/workflows/cloudflare-image-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finish Gemini image migration
        run: python3 .github/scripts/refactor_cloudflare_images_pass2.py

      - name: Show source diff
        run: git diff -- supabase/functions

      - name: Commit migration
        run: |
          git config user.name "Otmane2020"
          git config user.email "61626050+Otmane2020@users.noreply.github.com"
          git add supabase/functions
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "refactor: remove remaining Gemini image generation"
            git push origin HEAD:main
          fi

      - name: Audit entire repository for Gemini image generation
        run: |
          echo "Potential Gemini image-generation markers across repository:"
          grep -RniE --exclude-dir=.git --exclude='*.md' --exclude='*.lock' 'gemini-[^" ]*image|google/gemini-[^" ]*image|GEMINI_IMAGE_MODEL|responseModalities.*IMAGE|modalities.*\[.*image' . || true
