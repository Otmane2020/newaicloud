name: Apply catalog product search fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-catalog-product-search-fix.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply guarded catalog search patch
        run: python3 scripts/apply_catalog_product_search_fix.py

      - name: Install dependencies
        run: npm ci

      - name: Validate production build
        run: npm run build

      - name: Commit validated product search fix
        shell: bash
        run: |
          git config user.name "catalog-optimize-bot"
          git config user.email "actions@github.com"
          git add src/pages/Products.tsx
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No product search changes to commit"
            exit 0
          fi
          git commit -m "fix: search complete product catalog"
          git push origin HEAD:main

# trigger: catalog-search-fix-v2
