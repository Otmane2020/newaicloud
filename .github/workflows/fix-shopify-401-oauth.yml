name: Fix Shopify OAuth 401 imports

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-shopify-401-oauth.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch Shopify OAuth imports safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              if old not in source:
                  raise SystemExit(f'Expected block not found for {label}; refusing broad edit')
              return source.replace(old, new, 1)

          # 1) import-products: OAuth connection must be authoritative.
          path = Path('supabase/functions/import-products/index.ts')
          source = path.read_text()

          helper = '''/**
           * Normalize a stored Shopify store_url into a bare "<shop>.myshopify.com" domain.
           * Safe against protocols, paths and trailing slashes.
           */
          function normalizeShopDomain(storeUrl: string | null | undefined): string | null {
            if (!storeUrl) return null;
            const cleaned = storeUrl
              .trim()
              .replace(/^https?:\\/\\//i, '')
              .split('/')[0]
              .replace(/\\/+$/, '')
              .toLowerCase();
            if (!cleaned) return null;
            return cleaned.endsWith('.myshopify.com') ? cleaned : `${cleaned}.myshopify.com`;
          }

          '''
          if 'function normalizeShopDomain(' not in source:
              source = replace_once(source, 'interface RequestBody {\n', helper + 'interface RequestBody {\n', 'product shop-domain helper')
          source = source.replace('interface RequestBody {\n  shopName: string;\n', 'interface RequestBody {\n  shopName?: string;\n', 1)

          source = replace_once(
              source,
              "      apiKey: body.apiKey ? `✅ Present (length: ${body.apiKey.length})` : '⚠️  Not provided (OAuth)',\n      apiSecret: body.apiSecret ? `✅ Present (length: ${body.apiSecret.length}, starts with: ${body.apiSecret.substring(0, 10)}...)` : '❌ Missing or empty',",
              "      apiKey: body.apiKey ? '✅ Present' : '⚠️  Not provided (OAuth)',\n      apiSecret: body.apiSecret ? '✅ Present' : '❌ Missing or empty',",
              'credential-safe logging'
          )

          auth_start = source.index('    // Determine authentication method and get access token\n')
          auth_end = source.index('    if (!authToken) {\n', auth_start)
          new_auth = '''    // Determine authentication method and get access token
              const isManualAuth = !!apiKey && !storeId;
              let authToken = storeId ? '' : (apiSecret || '');
              let oauthShopDomain: string | null = null;
              const isOAuthMode = !!storeId;

              // OAuth mode: the server-side connection row is ALWAYS authoritative
              if (storeId) {
                console.log('🔍 Fetching access token from database for storeId:', storeId);
                
                const supabaseServiceClient = createClient(
                  Deno.env.get("SUPABASE_URL") ?? "",
                  Deno.env.get("SUPABASE_SERVICE_ROLE_KEY") ?? ""
                );
                
                const { data: connection, error: connectionError } = await supabaseServiceClient
                  .from('shopify_connections')
                  .select('access_token, store_url, user_id')
                  .eq('id', storeId)
                  .single();
                
                console.log('📊 Connection query result:', {
                  found: !!connection,
                  error: connectionError?.message,
                  matchesUser: connection?.user_id === user.id,
                  hasToken: !!connection?.access_token
                });
                
                if (connectionError) {
                  console.error('❌ Database error fetching connection:', connectionError);
                  return new Response(
                    JSON.stringify({ error: `Database error: ${connectionError.message}` }),
                    {
                      status: 500,
                      headers: { ...corsHeaders, "Content-Type": "application/json" },
                    }
                  );
                }
                
                if (!connection) {
                  console.error('❌ No connection found with storeId:', storeId);
                  return new Response(
                    JSON.stringify({ error: 'Store connection not found' }),
                    {
                      status: 404,
                      headers: { ...corsHeaders, "Content-Type": "application/json" },
                    }
                  );
                }
                
                if (connection.user_id !== user.id) {
                  console.error('❌ Store does not belong to user');
                  return new Response(
                    JSON.stringify({ error: 'Unauthorized access to store' }),
                    {
                      status: 403,
                      headers: { ...corsHeaders, "Content-Type": "application/json" },
                    }
                  );
                }

                if (!connection.access_token) {
                  return new Response(
                    JSON.stringify({
                      error: 'Shopify authorization expired. Please reconnect your Shopify store.',
                      code: 'SHOPIFY_REAUTH_REQUIRED'
                    }),
                    {
                      status: 401,
                      headers: { ...corsHeaders, "Content-Type": "application/json" },
                    }
                  );
                }
                
                // Server token/domain always win over anything sent by the browser
                authToken = connection.access_token;
                oauthShopDomain = normalizeShopDomain(connection.store_url);
                console.log('✅ Using OAuth access token from database (authoritative)');
              }
              
          '''
          # Dedent only the accidental Python indentation above.
          import textwrap
          new_auth = textwrap.dedent(new_auth)
          # Restore the 4-space TS nesting that dedent removes.
          new_auth = ''.join(('    ' + line if line.strip() else line) for line in new_auth.splitlines(True))
          source = source[:auth_start] + new_auth + source[auth_end:]

          source = replace_once(
              source,
              '    const cleanShopName = shopName.replace(".myshopify.com", "");\n',
              '''    const cleanShopName = (oauthShopDomain || shopName || '').replace(".myshopify.com", "");

              if (!cleanShopName) {
                return new Response(
                  JSON.stringify({ error: 'Missing shop domain' }),
                  { status: 400, headers: { ...corsHeaders, "Content-Type": "application/json" } }
                );
              }
          '''.replace('              ', ''),
              'authoritative product shop domain'
          )

          source = replace_once(
              source,
              "    let shopCurrency = 'USD';\n    try {",
              "    let shopCurrency = 'USD';\n    let shopAuthRejected = false;\n    try {",
              'product initial Shopify auth status'
          )
          source = replace_once(
              source,
              '      if (shopResponse.ok) {',
              '      if (shopResponse.status === 401) {\n        shopAuthRejected = true;\n      } else if (shopResponse.ok) {',
              'product 401 detection'
          )

          update_marker = '    // Update store currency if storeId is provided\n'
          if 'Shopify rejected the stored access token (401)' not in source:
              idx = source.index(update_marker)
              reauth = '''    // The authoritative Shopify token was rejected → user must reconnect
              if (shopAuthRejected) {
                console.error('❌ Shopify rejected the stored access token (401)');
                return new Response(
                  JSON.stringify({
                    error: isOAuthMode
                      ? 'Shopify authorization expired. Please reconnect your Shopify store.'
                      : 'Shopify rejected the provided credentials. Please check your API token.',
                    code: 'SHOPIFY_REAUTH_REQUIRED'
                  }),
                  { status: 401, headers: { ...corsHeaders, "Content-Type": "application/json" } }
                );
              }

          '''
              reauth = textwrap.dedent(reauth)
              reauth = ''.join(('    ' + line if line.strip() else line) for line in reauth.splitlines(True))
              source = source[:idx] + reauth + source[idx:]

          path.write_text(source)

          # 2) import-shopify-articles: same authoritative OAuth token/domain rule.
          path = Path('supabase/functions/import-shopify-articles/index.ts')
          source = path.read_text()

          article_helper = '''/**
           * Normalize a stored Shopify store_url into a bare "<shop>.myshopify.com" domain.
           */
          function normalizeShopDomain(storeUrl: string | null | undefined): string | null {
            if (!storeUrl) return null;
            const cleaned = storeUrl
              .trim()
              .replace(/^https?:\\/\\//i, '')
              .split('/')[0]
              .replace(/\\/+$/, '')
              .toLowerCase();
            if (!cleaned) return null;
            return cleaned.endsWith('.myshopify.com') ? cleaned : `${cleaned}.myshopify.com`;
          }

          '''
          article_helper = textwrap.dedent(article_helper)
          if 'function normalizeShopDomain(' not in source:
              source = replace_once(source, 'function extractImagesFromHtml(', article_helper + 'function extractImagesFromHtml(', 'article shop-domain helper')

          block_start = source.index('    let { shopName, apiSecret, authToken, storeId } = requestBody;\n')
          block_end = source.index('    if (!accessToken) {\n', block_start)
          article_auth = '''    let { shopName, apiSecret, authToken, storeId } = requestBody;

              // Manual auth only: token comes from the request. In OAuth mode the DB is authoritative.
              let accessToken: string | undefined = storeId ? undefined : (apiSecret || authToken);
              const isOAuthMode = !!storeId;
              
              if (storeId) {
                console.log('🔍 [ARTICLES] Fetching store details from database for storeId:', storeId);
                
                const supabaseServiceClient = createClient(
                  Deno.env.get("SUPABASE_URL") ?? "",
                  Deno.env.get("SUPABASE_SERVICE_ROLE_KEY") ?? ""
                );
                
                const { data: connection, error: connectionError } = await supabaseServiceClient
                  .from('shopify_connections')
                  .select('access_token, store_url, user_id')
                  .eq('id', storeId)
                  .single();
                
                console.log('📊 [ARTICLES] Connection query result:', {
                  found: !!connection,
                  error: connectionError?.message,
                  matchesUser: connection?.user_id === user.id,
                  hasToken: !!connection?.access_token
                });
                
                if (connectionError) {
                  console.error('❌ [ARTICLES] Database error:', connectionError);
                  return new Response(
                    JSON.stringify({ error: `Database error: ${connectionError.message}` }),
                    {
                      status: 500,
                      headers: { ...corsHeaders, "Content-Type": "application/json" },
                    }
                  );
                }
                
                if (!connection) {
                  console.error('❌ [ARTICLES] No connection found');
                  return new Response(
                    JSON.stringify({ error: 'Store connection not found' }),
                    {
                      status: 404,
                      headers: { ...corsHeaders, "Content-Type": "application/json" },
                    }
                  );
                }
                
                if (connection.user_id !== user.id) {
                  console.error('❌ [ARTICLES] Store does not belong to user');
                  return new Response(
                    JSON.stringify({ error: 'Unauthorized access to store' }),
                    {
                      status: 403,
                      headers: { ...corsHeaders, "Content-Type": "application/json" },
                    }
                  );
                }

                if (!connection.access_token) {
                  return new Response(
                    JSON.stringify({
                      error: 'Shopify authorization expired. Please reconnect your Shopify store.',
                      code: 'SHOPIFY_REAUTH_REQUIRED'
                    }),
                    {
                      status: 401,
                      headers: { ...corsHeaders, "Content-Type": "application/json" },
                    }
                  );
                }
                
                // Server-side connection always wins over anything sent by the browser
                shopName = normalizeShopDomain(connection.store_url) ?? undefined;
                accessToken = connection.access_token;
                
                console.log('✅ [ARTICLES] Using OAuth token + shop domain from database (authoritative):', shopName);
              }
              
          '''
          article_auth = textwrap.dedent(article_auth)
          article_auth = ''.join(('    ' + line if line.strip() else line) for line in article_auth.splitlines(True))
          source = source[:block_start] + article_auth + source[block_end:]

          generic_error = '''      return new Response(
                JSON.stringify({ error: `Shopify API error: ${blogsResponse.status}` }),
          '''
          if "blogsResponse.status === 401" not in source:
              generic_idx = source.index('      return new Response(\n        JSON.stringify({ error: `Shopify API error: ${blogsResponse.status}` })')
              article_reauth = '''      if (blogsResponse.status === 401) {
                return new Response(
                  JSON.stringify({
                    error: isOAuthMode
                      ? 'Shopify authorization expired. Please reconnect your Shopify store.'
                      : 'Shopify rejected the provided credentials. Please check your API token.',
                    code: 'SHOPIFY_REAUTH_REQUIRED'
                  }),
                  {
                    status: 401,
                    headers: { ...corsHeaders, "Content-Type": "application/json" },
                  }
                );
              }
              
          '''
              article_reauth = textwrap.dedent(article_reauth)
              article_reauth = ''.join(('      ' + line if line.strip() else line) for line in article_reauth.splitlines(True))
              source = source[:generic_idx] + article_reauth + source[generic_idx:]

          path.write_text(source)

          # 3) Validation: OAuth storeId can resolve shop/token server-side; manual validation remains.
          path = Path('supabase/functions/_shared/validation.ts')
          source = path.read_text()
          start = source.index('export function validateImportProducts(')
          end = source.index('// Simple validation for create-checkout', start)
          new_validation = '''export function validateImportProducts(data: any): ValidationResult<{
            shopName?: string;
            apiKey?: string;
            apiSecret?: string;
            storeId?: string;
          }> {
            const errors: ValidationError[] = [];

            const uuidRegex = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
            const isOAuth = typeof data.storeId === 'string' && uuidRegex.test(data.storeId);

            // In OAuth mode the shop domain comes from the server-side connection row.
            if (data.shopName === undefined || data.shopName === null || data.shopName === '') {
              if (!isOAuth) {
                errors.push({ path: ['shopName'], message: 'Shop name is required' });
              }
            } else if (typeof data.shopName !== 'string') {
              errors.push({ path: ['shopName'], message: 'Shop name is required' });
            } else {
              const trimmed = data.shopName.trim();
              if (trimmed.length < 3) {
                errors.push({ path: ['shopName'], message: 'Shop name must be at least 3 characters' });
              } else if (trimmed.length > 100) {
                errors.push({ path: ['shopName'], message: 'Shop name must be less than 100 characters' });
              } else if (!/^[a-zA-Z0-9-_.]+$/.test(trimmed)) {
                errors.push({ path: ['shopName'], message: 'Shop name can only contain letters, numbers, hyphens, underscores, and dots' });
              }
            }

            const hasApiKey = data.apiKey && typeof data.apiKey === 'string' && data.apiKey.trim().length > 0;
            const hasApiSecret = data.apiSecret && typeof data.apiSecret === 'string' && data.apiSecret.trim().length > 0;
            const hasStoreId = data.storeId && typeof data.storeId === 'string';

            if (!hasApiSecret && !hasStoreId) {
              errors.push({ path: ['apiSecret'], message: 'API Secret or Store ID is required' });
            }
            
            if (hasApiSecret && !isOAuth) {
              const trimmed = data.apiSecret.trim();
              if (trimmed.length < 20) {
                errors.push({ path: ['apiSecret'], message: 'API Secret appears to be invalid' });
              } else if (trimmed.length > 500) {
                errors.push({ path: ['apiSecret'], message: 'API Secret is too long' });
              }
            }

            if (hasApiKey && !isOAuth) {
              const trimmed = data.apiKey.trim();
              if (trimmed.length < 20) {
                errors.push({ path: ['apiKey'], message: 'API Key appears to be invalid' });
              } else if (trimmed.length > 100) {
                errors.push({ path: ['apiKey'], message: 'API Key is too long' });
              }
            }

            if (data.storeId !== undefined && data.storeId !== null) {
              if (typeof data.storeId !== 'string') {
                errors.push({ path: ['storeId'], message: 'Store ID must be a string' });
              } else if (!uuidRegex.test(data.storeId)) {
                errors.push({ path: ['storeId'], message: 'Store ID must be a valid UUID' });
              }
            }

            if (errors.length > 0) {
              return { success: false, errors };
            }

            return {
              success: true,
              data: {
                shopName: typeof data.shopName === 'string' && data.shopName.trim() ? data.shopName.trim() : undefined,
                apiKey: hasApiKey ? data.apiKey.trim() : undefined,
                apiSecret: hasApiSecret ? data.apiSecret.trim() : undefined,
                storeId: data.storeId
              }
            };
          }

          '''
          new_validation = textwrap.dedent(new_validation)
          source = source[:start] + new_validation + source[end:]
          path.write_text(source)
          PY

          git diff --check
          git diff --exit-code --quiet && { echo 'No change produced'; exit 1; } || true

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/import-products/index.ts supabase/functions/import-shopify-articles/index.ts supabase/functions/_shared/validation.ts
          git commit -m "Fix Shopify OAuth 401 imports"
          git push origin HEAD:main