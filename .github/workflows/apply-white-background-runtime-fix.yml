name: Apply white background runtime fix

on:
  push:
    branches:
      - chatgpt/fix-white-background-runtime
    paths:
      - .github/workflows/apply-white-background-runtime-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/fix-white-background-runtime
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/apply_white_bg_fix.py

      - name: Commit fixes
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/generate-white-background/index.ts src/pages/ProductTitleDescription.tsx
          git commit -m "Fix white background provider fallback and runtime handling"
          git push origin HEAD:chatgpt/fix-white-background-runtime
