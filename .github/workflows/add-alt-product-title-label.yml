name: Add ALT product title label

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-alt-product-title-label.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Add product title hierarchy label
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/components/seo/SeoAltImageList.tsx')
          text = path.read_text()

          if 'Product title' in text:
              print('Product title label already present.')
          else:
              pattern = re.compile(
                  r'<div className="text-left">\s*'
                  r'<h3 className="font-semibold">\{product\.title\}</h3>\s*'
                  r'<p className="text-sm text-muted-foreground">\s*'
                  r'\{product\.images\.length\} image\(s\)\s*'
                  r'</p>\s*</div>'
              )
              indent = ' ' * 26
              inner = ' ' * 28
              deep = ' ' * 30
              replacement = (
                  '<div className="min-w-0 text-left">\n'
                  + inner + '<p className="mb-1 text-[10px] font-semibold uppercase tracking-[0.12em] text-muted-foreground">\n'
                  + deep + 'Product title\n'
                  + inner + '</p>\n'
                  + inner + '<h3 className="truncate font-semibold leading-tight text-foreground">{product.title}</h3>\n'
                  + inner + '<p className="mt-1 text-sm text-muted-foreground">\n'
                  + deep + '{product.images.length} image(s)\n'
                  + inner + '</p>\n'
                  + indent + '</div>'
              )
              updated, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'Expected one product title block, found {count}; aborting.')
              path.write_text(updated)

      - name: Validate diff
        run: git diff --check

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "catalog-optimize-bot"
          git config user.email "catalog-optimize-bot@users.noreply.github.com"
          git add src/components/seo/SeoAltImageList.tsx
          git commit -m "Improve ALT image product hierarchy"
          git push origin main
