name: Modernize content workspaces

on:
  push:
    paths:
      - '.github/workflows/modernize-content-workspaces.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply focused UI patches
        shell: python
        run: |
          from pathlib import Path
          import re

          def patch(path_name, transforms):
              path = Path(path_name)
              text = path.read_text()
              for transform in transforms:
                  text = transform(text)
              path.write_text(text)

          def regex_replace(pattern, replacement, label, count=1):
              def apply(text):
                  updated, n = re.subn(pattern, replacement, text, count=count, flags=re.S)
                  if n != count:
                      raise SystemExit(f'{label}: expected {count} replacement(s), got {n}')
                  return updated
              return apply

          # Collections: remove decorative hero/stats and merge all controls into one compact toolbar.
          patch('src/components/seo/CollectionOptimization.tsx', [
              regex_replace(
                  r'      <Card className="bg-gradient-to-br from-blue-50.*?      \{/\* Usage limits alert \*/\}',
                  '''      <Card className="border-slate-200 p-3 shadow-none">
        <div className="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
          <div className="flex flex-wrap items-center gap-2">
            <Badge variant="outline">{collections.length} collections</Badge>
            <Badge variant="outline">SEO {globalSeoScore}/100</Badge>
            <Badge variant="outline">{notOptimizedCount} à optimiser</Badge>
            <Badge variant="outline">{optimizedCount} optimisées</Badge>
          </div>
          {isTypeRunning('collections') ? (
            <div className="min-w-56"><ProgressBanner current={optimizationState.current} total={optimizationState.total} label="Collections" /></div>
          ) : (
            <Button size="sm" onClick={notOptimizedCount > 0 ? handleOptimizeAllCollections : handleReoptimizeAllCollections} disabled={collections.length === 0}>
              <Sparkles className="mr-1.5 h-4 w-4" />
              {notOptimizedCount > 0 ? `Optimiser (${notOptimizedCount})` : 'Ré-optimiser'}
            </Button>
          )}
        </div>
      </Card>

      {/* Usage limits alert */}''',
                  'collection hero'
              ),
              regex_replace(
                  r'      \{/\* Sticky Action Bar \*/\}.*?      \{/\* Collections Table/Grid \*/\}',
                  '''      <Card className="border-slate-200 p-3 shadow-none">
        <div className="flex flex-col gap-2 xl:flex-row xl:items-center xl:justify-between">
          <div className="flex flex-1 flex-wrap items-center gap-2">
            <div className="relative min-w-[240px] flex-1">
              <Search className="absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted-foreground" />
              <Input placeholder="Rechercher une collection" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="h-9 pl-9" />
            </div>
            <Select value={statusFilter} onValueChange={(value: StatusFilter) => setStatusFilter(value)}>
              <SelectTrigger className="h-9 w-[150px]"><SelectValue placeholder="Statut" /></SelectTrigger>
              <SelectContent><SelectItem value="all">Tous</SelectItem><SelectItem value="optimized">Optimisées</SelectItem><SelectItem value="not-optimized">À optimiser</SelectItem></SelectContent>
            </Select>
            <Select value={qualityFilter} onValueChange={(value: QualityFilter) => setQualityFilter(value)}>
              <SelectTrigger className="h-9 w-[150px]"><SelectValue placeholder="Qualité" /></SelectTrigger>
              <SelectContent><SelectItem value="all">Toute qualité</SelectItem><SelectItem value="excellent">Excellent</SelectItem><SelectItem value="good">Bon</SelectItem><SelectItem value="medium">Moyen</SelectItem><SelectItem value="poor">Faible</SelectItem></SelectContent>
            </Select>
          </div>
          <div className="flex flex-wrap items-center gap-2">
            <label className="flex items-center gap-2 text-xs text-muted-foreground"><Checkbox checked={selectedCollections.size === paginatedCollections.length && paginatedCollections.length > 0} onCheckedChange={handleSelectAll} />{selectedCollections.size > 0 ? `${selectedCollections.size} sélectionnées` : 'Sélectionner la page'}</label>
            <Button size="sm" onClick={() => handleOptimizeSelected()} disabled={selectedCollections.size === 0 || isTypeRunning('collections')}><Sparkles className="mr-1.5 h-4 w-4" />Optimiser</Button>
            <details className="relative">
              <summary className="list-none cursor-pointer rounded-lg border px-3 py-2 text-sm font-medium hover:bg-muted">Plus</summary>
              <div className="absolute right-0 z-30 mt-2 grid min-w-56 gap-1 rounded-xl border bg-background p-2 shadow-xl">
                <Button variant="ghost" size="sm" className="justify-start" onClick={handleGenerateAll} disabled={isTypeRunning('collections') || notOptimizedCount === 0}><Sparkles className="mr-2 h-4 w-4" />Optimiser les manquantes</Button>
                <Button variant="ghost" size="sm" className="justify-start" onClick={handleGenerateAICollections} disabled={generatingCollections || isTypeRunning('collections')}><Zap className="mr-2 h-4 w-4" />Générer collections IA</Button>
                <Button variant="ghost" size="sm" className="justify-start" onClick={fetchCollections} disabled={loading}><RefreshCw className="mr-2 h-4 w-4" />Actualiser</Button>
              </div>
            </details>
          </div>
        </div>
        <div className="mt-2 flex flex-wrap gap-1 border-t pt-2">
          {tabs.map((tab) => <Button key={tab.id} size="sm" variant={activeTab === tab.id ? 'secondary' : 'ghost'} className="h-7 text-xs" onClick={() => setActiveTab(tab.id)}>{tab.label} <span className="ml-1 text-muted-foreground">{tab.count}</span></Button>)}
        </div>
      </Card>

      {/* Collections Table/Grid */}''',
                  'collection toolbar'
              ),
          ])

          # Pages: compact summary and one toolbar instead of duplicate banners/action rows.
          patch('src/components/seo/PageOptimization.tsx', [
              regex_replace(
                  r'      \{/\* Vision AI Banner \*/\}.*?      \{/\* Pages Table \*/\}',
                  '''      <Card className="border-slate-200 p-3 shadow-none">
        <div className="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
          <div className="flex flex-wrap items-center gap-2">
            <Badge variant="outline">{pages.length} pages</Badge>
            <Badge variant="outline">SEO {globalPageSeoScore}/100</Badge>
            <Badge variant="outline">{pages.filter(p => !p.optimized).length} à optimiser</Badge>
            <Badge variant="outline">{pages.filter(p => p.optimized).length} optimisées</Badge>
          </div>
          {isTypeRunning('pages') && <div className="min-w-56"><ProgressBanner current={optimizationState.current} total={optimizationState.total} label="Pages" /></div>}
        </div>
      </Card>

      {/* Pages Table */}''',
                  'page summary'
              ),
              regex_replace(
                  r'            \{/\* Sticky Action Bar \*/\}.*?            <div className="overflow-x-auto">',
                  '''            <div className="mb-3 flex flex-col gap-2 xl:flex-row xl:items-center xl:justify-between">
              <div className="flex flex-1 flex-wrap items-center gap-2">
                <div className="relative min-w-[240px] flex-1">
                  <Search className="absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted-foreground" />
                  <Input type="text" placeholder="Rechercher une page" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="h-9 pl-9" />
                </div>
                <Select value={statusFilter} onValueChange={(value: StatusFilter) => setStatusFilter(value)}>
                  <SelectTrigger className="h-9 w-[150px]"><SelectValue placeholder="Statut" /></SelectTrigger>
                  <SelectContent><SelectItem value="all">Toutes</SelectItem><SelectItem value="optimized">Optimisées</SelectItem><SelectItem value="not-optimized">À optimiser</SelectItem></SelectContent>
                </Select>
                <Select value={qualityFilter} onValueChange={(value: QualityFilter) => setQualityFilter(value)}>
                  <SelectTrigger className="h-9 w-[150px]"><SelectValue placeholder="Qualité" /></SelectTrigger>
                  <SelectContent><SelectItem value="all">Toute qualité</SelectItem><SelectItem value="excellent">Excellent</SelectItem><SelectItem value="good">Bon</SelectItem><SelectItem value="medium">Moyen</SelectItem><SelectItem value="poor">Faible</SelectItem></SelectContent>
                </Select>
              </div>
              <div className="flex flex-wrap items-center gap-2">
                <label className="flex items-center gap-2 text-xs text-muted-foreground"><Checkbox checked={selectedPages.size === filteredPages.length && filteredPages.length > 0} onCheckedChange={handleSelectAll} />{selectedPages.size > 0 ? `${selectedPages.size} sélectionnées` : 'Tout sélectionner'}</label>
                <Button size="sm" onClick={() => handleOptimizeSelected()} disabled={selectedPages.size === 0 || isTypeRunning('pages')}><Sparkles className="mr-1.5 h-4 w-4" />Optimiser</Button>
                <details className="relative">
                  <summary className="list-none cursor-pointer rounded-lg border px-3 py-2 text-sm font-medium hover:bg-muted">Plus</summary>
                  <div className="absolute right-0 z-30 mt-2 grid min-w-52 gap-1 rounded-xl border bg-background p-2 shadow-xl">
                    <Button variant="ghost" size="sm" className="justify-start" onClick={pages.filter(p => !p.optimized).length > 0 ? handleOptimizeAll : handleReoptimizeAllPages} disabled={isTypeRunning('pages')}><Sparkles className="mr-2 h-4 w-4" />Optimiser tout</Button>
                    <Button variant="ghost" size="sm" className="justify-start" onClick={handleImportPages} disabled={importingPages}><FileText className="mr-2 h-4 w-4" />Importer Shopify</Button>
                    <Button variant="ghost" size="sm" className="justify-start" onClick={fetchPages} disabled={loading}><RefreshCw className="mr-2 h-4 w-4" />Actualiser</Button>
                  </div>
                </details>
              </div>
            </div>

            <div className="overflow-x-auto">''',
                  'page toolbar'
              ),
          ])

          # Tags: keep functionality but collapse cards + duplicate filter rows into one toolbar.
          patch('src/components/seo/TagOptimization.tsx', [
              regex_replace(
                  r'      <div className="grid gap-3 sm:grid-cols-3">.*?      \{/\* Products Display \*/\}',
                  '''      <Card className="border-slate-200 p-3 shadow-none">
        <div className="flex flex-col gap-2 xl:flex-row xl:items-center xl:justify-between">
          <div className="flex flex-1 flex-wrap items-center gap-2">
            <div className="relative min-w-[240px] flex-1">
              <Search className="absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted-foreground" />
              <Input placeholder="Rechercher un produit" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="h-9 pl-9" />
            </div>
            <Select value={selectedCategory} onValueChange={setSelectedCategory}>
              <SelectTrigger className="h-9 w-[170px]"><SelectValue placeholder="Catégorie" /></SelectTrigger>
              <SelectContent><SelectItem value="all">Toutes catégories</SelectItem>{uniqueCategories.map((category) => <SelectItem key={category} value={category}>{category}</SelectItem>)}</SelectContent>
            </Select>
            <div className="flex rounded-lg border p-0.5">
              {filters.map((item) => <Button key={item.id} size="sm" variant={filter === item.id ? 'secondary' : 'ghost'} className="h-7 px-2 text-xs" onClick={() => setFilter(item.id)}>{item.label} <span className="ml-1 text-muted-foreground">{item.count}</span></Button>)}
            </div>
          </div>
          <div className="flex flex-wrap items-center gap-2">
            <label className="flex items-center gap-2 text-xs text-muted-foreground"><Checkbox checked={selectedProducts.size === filteredProducts.length && filteredProducts.length > 0} onCheckedChange={handleSelectAll} />{selectedProducts.size > 0 ? `${selectedProducts.size} sélectionnés` : 'Sélectionner'}</label>
            <Button size="sm" onClick={() => handleGenerateSelected(false)} disabled={selectedProducts.size === 0 || isTypeRunning('tags')}><Sparkles className="mr-1.5 h-4 w-4" />Optimiser</Button>
            <details className="relative">
              <summary className="list-none cursor-pointer rounded-lg border px-3 py-2 text-sm font-medium hover:bg-muted">Plus</summary>
              <div className="absolute right-0 z-30 mt-2 grid min-w-52 gap-1 rounded-xl border bg-background p-2 shadow-xl">
                <Button variant="ghost" size="sm" className="justify-start" onClick={handleGenerateAllTags} disabled={productsNotOptimized === 0 || isTypeRunning('tags')}><Sparkles className="mr-2 h-4 w-4" />Générer manquants</Button>
                <Button variant="ghost" size="sm" className="justify-start" onClick={handleReoptimizeAll} disabled={isTypeRunning('tags') || products.length === 0}><RefreshCw className="mr-2 h-4 w-4" />Ré-optimiser tout</Button>
                <Button variant="ghost" size="sm" className="justify-start" onClick={fetchProducts} disabled={loading}><RefreshCw className="mr-2 h-4 w-4" />Actualiser</Button>
              </div>
            </details>
          </div>
        </div>
      </Card>

      {/* Products Display */}''',
                  'tag toolbar'
              ),
          ])

          # ALT: one compact toolbar for status, content type, search and actions.
          patch('src/components/seo/SeoAltImage.tsx', [
              regex_replace(
                  r'      <div className="grid gap-3 sm:grid-cols-3">.*?      \{/\* Progress \*/\}',
                  '''      <Card className="border-slate-200 p-3 shadow-none">
        <div className="flex flex-col gap-2 xl:flex-row xl:items-center xl:justify-between">
          <div className="flex flex-1 flex-wrap items-center gap-2">
            <div className="relative min-w-[240px] flex-1">
              <Search className="absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted-foreground" />
              <Input placeholder={t.seo.altImage.table.searchPlaceholder} value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="h-9 pl-9" />
            </div>
            <Select value={contentTypeFilter} onValueChange={(value: ContentTypeFilter) => { setContentTypeFilter(value); goToPage(1); }}>
              <SelectTrigger className="h-9 w-[170px]"><SelectValue placeholder="Type" /></SelectTrigger>
              <SelectContent><SelectItem value="all">Tous contenus</SelectItem><SelectItem value="products">Produits</SelectItem><SelectItem value="collections">Collections</SelectItem><SelectItem value="pages">Pages</SelectItem><SelectItem value="articles">Articles</SelectItem><SelectItem value="homepage">Accueil</SelectItem></SelectContent>
            </Select>
            <div className="flex rounded-lg border p-0.5">
              {tabs.map((item) => <Button key={item.id} size="sm" variant={activeTab === item.id ? 'secondary' : 'ghost'} className="h-7 px-2 text-xs" onClick={() => { setActiveTab(item.id); goToPage(1); }}>{item.label} <span className="ml-1 text-muted-foreground">{item.count}</span></Button>)}
            </div>
          </div>
          <div className="flex flex-wrap items-center gap-2">
            <label className="flex items-center gap-2 text-xs text-muted-foreground"><Checkbox checked={selectedImages.size === sortedImages.length && sortedImages.length > 0} onCheckedChange={handleSelectAll} />{selectedImages.size > 0 ? `${selectedImages.size} sélectionnées` : 'Sélectionner'}</label>
            <Button size="sm" onClick={() => handleGenerateForSelected(false)} disabled={selectedImages.size === 0 || isTypeRunning('alt')}><Sparkles className="mr-1.5 h-4 w-4" />Générer ALT</Button>
            <details className="relative">
              <summary className="list-none cursor-pointer rounded-lg border px-3 py-2 text-sm font-medium hover:bg-muted">Plus</summary>
              <div className="absolute right-0 z-30 mt-2 grid min-w-56 gap-1 rounded-xl border bg-background p-2 shadow-xl">
                <Button variant="ghost" size="sm" className="justify-start" onClick={handleOptimizeAllImages} disabled={imagesNotOptimized === 0 || isTypeRunning('alt')}><Sparkles className="mr-2 h-4 w-4" />Optimiser manquantes</Button>
                <Button variant="ghost" size="sm" className="justify-start" onClick={handleReoptimizeAllImages} disabled={images.length === 0 || isTypeRunning('alt')}><RefreshCw className="mr-2 h-4 w-4" />Ré-générer tout</Button>
                <Button variant="ghost" size="sm" className="justify-start" onClick={handleImportContentImages} disabled={importing}><ImageIcon className="mr-2 h-4 w-4" />Importer images contenu</Button>
                <Button variant="ghost" size="sm" className="justify-start" onClick={fetchImages} disabled={loading}><RefreshCw className="mr-2 h-4 w-4" />Actualiser</Button>
              </div>
            </details>
          </div>
        </div>
        <div className="mt-2 flex flex-wrap gap-2 border-t pt-2 text-xs text-muted-foreground">
          <span>{imagesFilteredByType.length} images</span><span>·</span><span>{imagesNotOptimized} sans ALT optimisé</span><span>·</span><span>SEO {altSeoScore}/100</span>
        </div>
      </Card>

      {/* Progress */}''',
                  'alt toolbar'
              ),
          ])

          # Blog: pagination + compact header/actions + fewer visible columns.
          def patch_blog(text):
              text = text.replace(
                  "  Filter,\n  ChevronDown\n} from 'lucide-react';",
                  "  Filter,\n  ChevronDown,\n  ChevronLeft,\n  ChevronRight\n} from 'lucide-react';",
                  1,
              )
              text = text.replace(
                  "  const [optimizing, setOptimizing] = useState(false);\n",
                  "  const [optimizing, setOptimizing] = useState(false);\n  const [currentPage, setCurrentPage] = useState(1);\n  const pageSize = 25;\n",
                  1,
              )
              anchor = "  // Détecter les articles orphelins (sans store_id)\n"
              reset_effect = '''  useEffect(() => {
    setCurrentPage(1);
  }, [searchQuery, statusFilter, sourceFilter, qualityFilter, selectedStore?.id]);

'''
              if anchor not in text:
                  raise SystemExit('blog pagination reset anchor missing')
              text = text.replace(anchor, reset_effect + anchor, 1)

              stats_anchor = "  const stats = {\n"
              pagination = '''  const totalPages = Math.max(1, Math.ceil(filteredArticles.length / pageSize));
  const paginatedArticles = filteredArticles.slice((currentPage - 1) * pageSize, currentPage * pageSize);

'''
              if stats_anchor not in text:
                  raise SystemExit('blog stats anchor missing')
              text = text.replace(stats_anchor, pagination + stats_anchor, 1)
              text = text.replace("{filteredArticles.map((article) => (", "{paginatedArticles.map((article) => (", 1)
              text = text.replace("if (selectedArticles.length === filteredArticles.length) {", "if (selectedArticles.length === paginatedArticles.length) {", 1)
              text = text.replace("setSelectedArticles(filteredArticles.map(a => a.id));", "setSelectedArticles(paginatedArticles.map(a => a.id));", 1)
              text = text.replace("checked={selectedArticles.length === filteredArticles.length && filteredArticles.length > 0}", "checked={selectedArticles.length === paginatedArticles.length && paginatedArticles.length > 0}", 1)
              text = text.replace("checked={selectedArticles.length === filteredArticles.length}", "checked={selectedArticles.length === paginatedArticles.length}", 1)

              text = re.sub(
                  r'      \{/\* Interactive Dashboard Cards - 2 filters \*/\}.*?      \{/\* Sticky Action Bar \*/\}',
                  '''      <Card className="mb-4 border-slate-200 p-3 shadow-none">
        <div className="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
          <div className="flex flex-wrap items-center gap-2 text-sm">
            <Badge variant="outline">{stats.total} articles</Badge>
            <Badge variant="outline">{stats.total - stats.seoOptimized} à optimiser</Badge>
            <Badge variant="outline">{stats.seoOptimized} optimisés</Badge>
            <Badge variant="outline">{stats.published} publiés</Badge>
          </div>
          <Button onClick={() => setShowWizard(true)} size="sm"><Plus className="mr-1.5 h-4 w-4" />{t.blog.articleSeoManagement.createArticle}</Button>
        </div>
      </Card>

      {/* Sticky Action Bar */}''',
                  text,
                  count=1,
                  flags=re.S,
              )

              text = re.sub(
                  r'      \{/\* Sticky Action Bar \*/\}.*?      \{/\* Articles Table \*/\}',
                  '''      <Card className="mb-4 border-slate-200 p-3 shadow-none">
        <div className="flex flex-col gap-2 xl:flex-row xl:items-center xl:justify-between">
          <div className="flex flex-1 flex-wrap items-center gap-2">
            <div className="relative min-w-[240px] flex-1">
              <Search className="absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted-foreground" />
              <Input placeholder="Rechercher un article" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="h-9 pl-9" />
            </div>
            <Popover>
              <PopoverTrigger asChild><Button variant="outline" size="sm"><Filter className="mr-1.5 h-4 w-4" />Filtres</Button></PopoverTrigger>
              <PopoverContent className="w-72 p-3" align="end">
                <div className="space-y-3">
                  <Select value={sourceFilter} onValueChange={setSourceFilter}><SelectTrigger className="h-9"><SelectValue placeholder="Source" /></SelectTrigger><SelectContent><SelectItem value="all">Toutes sources</SelectItem><SelectItem value="ai">IA</SelectItem><SelectItem value="shopify">Shopify</SelectItem></SelectContent></Select>
                  <Select value={statusFilter} onValueChange={setStatusFilter}><SelectTrigger className="h-9"><SelectValue placeholder="Statut" /></SelectTrigger><SelectContent><SelectItem value="all">Tous statuts</SelectItem><SelectItem value="draft">Brouillon</SelectItem><SelectItem value="published">Publié</SelectItem></SelectContent></Select>
                  <Select value={qualityFilter} onValueChange={(value) => setQualityFilter(value as any)}><SelectTrigger className="h-9"><SelectValue placeholder="Qualité SEO" /></SelectTrigger><SelectContent><SelectItem value="all">Tous scores</SelectItem><SelectItem value="excellent">Excellent</SelectItem><SelectItem value="good">Bon</SelectItem><SelectItem value="medium">Moyen</SelectItem><SelectItem value="poor">Faible</SelectItem></SelectContent></Select>
                </div>
              </PopoverContent>
            </Popover>
          </div>
          <div className="flex flex-wrap items-center gap-2">
            <label className="flex items-center gap-2 text-xs text-muted-foreground"><Checkbox checked={selectedArticles.length === paginatedArticles.length && paginatedArticles.length > 0} onCheckedChange={toggleSelectAll} />{selectedArticles.length > 0 ? `${selectedArticles.length} sélectionnés` : 'Sélectionner la page'}</label>
            <Button size="sm" onClick={() => optimizeArticles(selectedArticles)} disabled={selectedArticles.length === 0}><Sparkles className="mr-1.5 h-4 w-4" />Optimiser</Button>
            <details className="relative">
              <summary className="list-none cursor-pointer rounded-lg border px-3 py-2 text-sm font-medium hover:bg-muted">Plus</summary>
              <div className="absolute right-0 z-30 mt-2 grid min-w-52 gap-1 rounded-xl border bg-background p-2 shadow-xl">
                <Button variant="ghost" size="sm" className="justify-start" onClick={articles.filter(a => (a.optimization_count || 0) === 0).length > 0 ? optimizeAllArticles : handleReoptimizeAllArticles}><Sparkles className="mr-2 h-4 w-4" />Optimiser tout</Button>
                <Button variant="ghost" size="sm" className="justify-start text-destructive" onClick={bulkDelete} disabled={selectedArticles.length === 0}><Trash2 className="mr-2 h-4 w-4" />Supprimer sélection</Button>
                <Button variant="ghost" size="sm" className="justify-start" onClick={loadArticles} disabled={loading}><RefreshCw className="mr-2 h-4 w-4" />Actualiser</Button>
              </div>
            </details>
          </div>
        </div>
        {optimizationState.isRunning && optimizationState.type === 'articles' && <div className="mt-2"><ProgressBanner current={optimizationState.current} total={optimizationState.total} label="Optimisation des articles" /></div>}
      </Card>

      {/* Articles Table */}''',
                  text,
                  count=1,
                  flags=re.S,
              )

              text = text.replace('<th className="p-3 text-left hidden sm:table-cell">Source</th>', '', 1)
              text = text.replace('<th className="p-3 text-left hidden md:table-cell">Published on Shopify</th>', '', 1)
              text = re.sub(r'\s*<td className="p-3 hidden sm:table-cell">\s*<Badge\s+variant=\{article\.source.*?</td>', '', text, count=1, flags=re.S)
              text = re.sub(r'\s*<td className="p-3 hidden md:table-cell">\s*\{article\.shopify_article_id \?.*?</td>', '', text, count=1, flags=re.S)

              pagination_footer = '''
        {totalPages > 1 && (
          <div className="mt-3 flex items-center justify-between rounded-xl border border-slate-200 bg-white px-3 py-2">
            <span className="text-xs text-muted-foreground">Page {currentPage}/{totalPages} · {filteredArticles.length} articles</span>
            <div className="flex gap-1">
              <Button size="icon" variant="ghost" className="h-8 w-8" disabled={currentPage <= 1} onClick={() => setCurrentPage((page) => Math.max(1, page - 1))}><ChevronLeft className="h-4 w-4" /></Button>
              <Button size="icon" variant="ghost" className="h-8 w-8" disabled={currentPage >= totalPages} onClick={() => setCurrentPage((page) => Math.min(totalPages, page + 1))}><ChevronRight className="h-4 w-4" /></Button>
            </div>
          </div>
        )}
'''
              marker = "\n      {/* Blog Wizard */}"
              if marker not in text:
                  raise SystemExit('blog wizard marker missing')
              text = text.replace(marker, pagination_footer + marker, 1)
              return text

          patch('src/pages/ArticleManagement.tsx', [patch_blog])

      - name: Commit patches
