name: Fix catalog product search

on:
  push:
    branches:
      - fix/catalog-product-search
    paths:
      - .github/workflows/fix-catalog-product-search.yml

permissions:
  contents: write

jobs:
  patch-products-search:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/catalog-product-search

      - name: Patch catalog product search
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("src/pages/Products.tsx")
          text = path.read_text()

          state_anchor = '  const [searchQuery, setSearchQuery] = useState("");\n'
          if state_anchor not in text:
              raise SystemExit("searchQuery state anchor not found")
          text = text.replace(
              state_anchor,
              state_anchor + '  const [debouncedSearchQuery, setDebouncedSearchQuery] = useState("");\n',
              1,
          )

          pagination_anchor = "  const ITEMS_PER_PAGE = 20;\n\n  // Scroll to top when page changes\n"
          if pagination_anchor not in text:
              raise SystemExit("pagination anchor not found")
          text = text.replace(
              pagination_anchor,
              '''  const ITEMS_PER_PAGE = 20;

  // Debounce catalog search so we query the complete store catalog without
  // firing a network request on every keystroke.
  useEffect(() => {
    const timer = window.setTimeout(() => {
      setDebouncedSearchQuery(searchQuery.trim());
    }, 300);

    return () => window.clearTimeout(timer);
  }, [searchQuery]);

  // Search/filter/sort changes always start from the first result page.
  useEffect(() => {
    setCurrentPage(1);
  }, [debouncedSearchQuery, statusFilter, sortBy, selectedStore?.id]);

  // Scroll to top when page changes
''',
              1,
          )

          start_marker = "      // Count total products first\n"
          end_marker = "      if (error) throw error;\n"
          start = text.find(start_marker)
          if start == -1:
              raise SystemExit("product query start marker not found")
          end = text.find(end_marker, start)
          if end == -1:
              raise SystemExit("product query end marker not found")
          end += len(end_marker)

          new_query_block = '''      // Apply search, status and sort in Supabase BEFORE pagination.
      // The previous implementation loaded only 20 rows and then searched locally,
      // so products on later pages could never be found.
      const safeSearch = debouncedSearchQuery
        .replace(/[^\\p{L}\\p{N}\\s_-]/gu, " ")
        .replace(/\\s+/g, " ")
        .trim();
      const searchPattern = safeSearch
        ? `%${safeSearch.split(" ").join("%")}%`
        : null;
      const searchableColumns = ["title", "description", "vendor", "product_type", "sku", "handle"];

      let countQuery = supabase
        .from("shopify_products")
        .select("*", { count: "exact", head: true })
        .eq("seller_id", user?.id)
        .eq("store_id", selectedStore.id);

      let productsQuery = supabase
        .from("shopify_products")
        .select("*, store_id")
        .eq("seller_id", user?.id)
        .eq("store_id", selectedStore.id);

      if (statusFilter !== "all") {
        countQuery = countQuery.eq("status", statusFilter);
        productsQuery = productsQuery.eq("status", statusFilter);
      }

      if (searchPattern) {
        const searchFilter = searchableColumns
          .map((column) => `${column}.ilike.${searchPattern}`)
          .join(",");
        countQuery = countQuery.or(searchFilter);
        productsQuery = productsQuery.or(searchFilter);
      }

      const { count, error: countError } = await countQuery;
      if (countError) throw countError;

      setTotalCount(count || 0);

      const sortConfig = (() => {
        switch (sortBy) {
          case "price-asc":
            return { column: "price", ascending: true };
          case "price-desc":
            return { column: "price", ascending: false };
          case "name-asc":
            return { column: "title", ascending: true };
          case "name-desc":
            return { column: "title", ascending: false };
          case "recent":
          default:
            return { column: "created_at", ascending: false };
        }
      })();

      const { data: rawData, error } = await productsQuery
        .order(sortConfig.column, { ascending: sortConfig.ascending })
        .range((currentPage - 1) * ITEMS_PER_PAGE, currentPage * ITEMS_PER_PAGE - 1);

      if (error) throw error;
'''
          text = text[:start] + new_query_block + text[end:]

          effect_anchor = "  }, [user, currentPage, selectedStore?.id]);\n"
          if effect_anchor not in text:
              raise SystemExit("load effect dependency anchor not found")
          text = text.replace(
              effect_anchor,
              "  }, [user, currentPage, selectedStore?.id, debouncedSearchQuery, statusFilter, sortBy]);\n",
              1,
          )

          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit search fix
        shell: bash
        run: |
          git config user.name "catalog-optimize-bot"
          git config user.email "actions@github.com"
          git add src/pages/Products.tsx
          git diff --cached --check
          git commit -m "fix: search full product catalog"
          git push origin fix/catalog-product-search
