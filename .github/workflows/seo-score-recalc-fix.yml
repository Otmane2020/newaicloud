name: Fix SEO score recalculation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-score-recalc-fix.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Make SEO scores data-driven
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/lib/seoQuality.ts')
          s = p.read_text()

          # Tags: correctly score comma-separated values AND JSON-array strings.
          start = s.index('export function calculateTagsScore(')
          end = s.index('/**\n * ═══════════════════════════════════════════════════════════════════════════', start)
          new_tags = '''export function calculateTagsScore(tags: string | null | undefined): number {\n  if (!tags || tags.trim().length === 0) return 0;\n\n  let tagArray: string[] = [];\n  try {\n    const parsed = JSON.parse(tags);\n    if (Array.isArray(parsed)) tagArray = parsed.map(String).map(t => t.trim()).filter(Boolean);\n  } catch {\n    tagArray = tags.split(',').map(t => t.trim()).filter(Boolean);\n  }\n\n  if (!tagArray.length) return 0;\n  let score = 5; // presence\n\n  if (tagArray.length >= 3 && tagArray.length <= 10) score += 10;\n  else score += 5;\n\n  const qualityTags = tagArray.filter(t => t.length > 3);\n  if (qualityTags.length >= tagArray.length * 0.7) score += 5;\n\n  return Math.min(score, 20);\n}\n\n'''
          s = s[:start] + new_tags + s[end:]

          # Replace fake 80-95 optimized score with a real content-quality score.
          fn_start = s.index('export function calculateDetailedSeoScore(')
          fn_end = s.index('/**\n * Normalize weighted ALT score', fn_start)
          new_fn = '''export function calculateDetailedSeoScore(\n  title: string | null | undefined,\n  description: string | null | undefined,\n  hasImage: boolean = false,\n  hasUrl: boolean = false,\n  tags?: string | null,\n  optimizationCount?: number,\n  itemId?: string\n): SeoScoreDetails {\n  const titleScore = calculateTitleScore(title);\n  const descScore = calculateDescriptionScore(description);\n  const tagsScore = calculateTagsScore(tags);\n\n  // The score must reflect the content that exists NOW. Optimization status must never\n  // replace the quality calculation with a synthetic/random score.\n  const weightedScore = Math.round(\n    (titleScore.score * 0.35) +\n    (descScore.score * 0.35) +\n    (tagsScore * 0.75) +\n    (hasImage ? 6 : 0) +\n    (hasUrl ? 6 : 0)\n  );\n\n  // Small, transparent credit for having been AI-reviewed. The score can still go up or\n  // down whenever title/description/tags/image/URL quality changes after a new optimization.\n  const optimizationBonus = (optimizationCount || 0) > 0 ? 3 : 0;\n  const finalScore = Math.min(100, weightedScore + optimizationBonus);\n\n  return {\n    score: Math.round(finalScore),\n    breakdown: {\n      presence: Math.round((titleScore.breakdown.presence + descScore.breakdown.presence) / 2),\n      length: Math.round((titleScore.breakdown.length + descScore.breakdown.length) / 2),\n      keywords: Math.round((titleScore.breakdown.keywords + descScore.breakdown.keywords) / 2),\n      readability: Math.round((titleScore.breakdown.readability + descScore.breakdown.readability) / 2),\n    },\n    maxScore: 100,\n  };\n}\n\n'''
          s = s[:fn_start] + new_fn + s[fn_end:]

          # ALT score: base it on actual ALT presence/quality instead of optimization_count alone.
          old = '''export function calculateImagesSeoScore(images: any[]): number {\n  if (!images || images.length === 0) return 0;\n  \n  const optimizedImages = images.filter(img => (img.optimization_count || 0) > 0).length;\n  return Math.round((optimizedImages / images.length) * 100);\n}\n'''
          new = '''export function calculateImagesSeoScore(images: any[]): number {\n  if (!images || images.length === 0) return 0;\n\n  const total = images.reduce((sum, img) => {\n    const altText = img.alt_text || img.alt || '';\n    if (!altText.trim()) return sum;\n    const isAI = Boolean(img.is_ai_generated ?? img.ai_generated ?? ((img.optimization_count || 0) > 0));\n    const detail = calculateAltTextScore(altText, isAI);\n    const normalized = detail.weight ? Math.min(100, Math.round(detail.score / detail.weight)) : 0;\n    return sum + normalized;\n  }, 0);\n\n  return Math.round(total / images.length);\n}\n'''
          if old not in s:
              raise SystemExit('calculateImagesSeoScore block not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          Path('.github/workflows/seo-score-recalc-fix.yml').unlink()
          PY
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Build
        run: npm run build
      - name: Commit score fix
        run: |
          git config user.name "Otmane2020"
          git config user.email "61626050+Otmane2020@users.noreply.github.com"
          git add -A
          git commit -m "fix: make SEO scores reflect optimized content quality"
          git push
