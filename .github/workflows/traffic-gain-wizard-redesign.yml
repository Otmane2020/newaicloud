name: Apply Traffic Gain wizard redesign

on:
  push:
    branches:
      - feat/traffic-gain-wizard-ui

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/traffic-gain-wizard-ui
          fetch-depth: 0

      - name: Patch wizard
        run: |
          echo '' | base64 -d > /tmp/traffic-gain-patch.py
          python /tmp/traffic-gain-patch.py
          git diff --check
          grep -q "Traffic Gain" src/components/blog/BlogWizard.tsx
          grep -q "SEO · GEO" src/components/blog/BlogWizard.tsx
          grep -q "Rechercher une collection…" src/components/blog/BlogWizard.tsx

      - name: Commit redesign
        run: |
          rm -f .traffic-gain-trigger .github/workflows/traffic-gain-wizard-redesign.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: redesign article wizard as Traffic Gain"
          git push origin HEAD:feat/traffic-gain-wizard-ui
