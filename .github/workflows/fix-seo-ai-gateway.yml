name: Fix SEO AI gateway

on:
  push:
    paths:
      - '.github/workflows/fix-seo-ai-gateway.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Repair patch script substitution handling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/fix-seo-ai-gateway.py')
          s = p.read_text()
          s = s.replace('re.subn(pattern, replacement, text, count=1, flags=re.S)', 're.subn(pattern, lambda _m: replacement, text, count=1, flags=re.S)')
          p.write_text(s)
          PY

      - name: Apply SEO AI gateway patch
        run: python .github/scripts/fix-seo-ai-gateway.py

      - name: Verify Lovable gateway removed from core SEO generators
        run: |
          ! grep -R "ai.gateway.lovable.dev" \
            supabase/functions/generate-page-seo/index.ts \
            supabase/functions/generate-collection-seo/index.ts \
            supabase/functions/generate-article-seo/index.ts \
            supabase/functions/generate-seo-with-deepseek/index.ts \
            supabase/functions/generate-product-description-html/index.ts

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Commit and cleanup
        run: |
          rm -f .github/workflows/fix-seo-ai-gateway.yml .github/scripts/fix-seo-ai-gateway.py
          git config user.name "catalog-optimize-bot"
          git config user.email "actions@github.com"
          git add \
            supabase/functions/generate-page-seo/index.ts \
            supabase/functions/generate-collection-seo/index.ts \
            supabase/functions/generate-article-seo/index.ts \
            supabase/functions/generate-seo-with-deepseek/index.ts \
            supabase/functions/generate-product-description-html/index.ts \
            .github/workflows/fix-seo-ai-gateway.yml \
            .github/scripts/fix-seo-ai-gateway.py
          git commit -m "fix: remove Lovable AI gateway dependency from SEO generation"
          git pull --rebase origin main
          git push origin main
