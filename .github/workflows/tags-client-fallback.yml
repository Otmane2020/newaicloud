name: Tags client fallback

on:
  push:
    paths:
      - '.github/workflows/tags-client-fallback.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply fallback patch
        run: python .github/scripts/tags-client-fallback.py

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Commit and cleanup
        run: |
          rm -f .github/workflows/tags-client-fallback.yml .github/scripts/tags-client-fallback.py
          git config user.name "catalog-optimize-bot"
          git config user.email "actions@github.com"
          git add src/components/seo/MinimalMetadataWorkspaces.tsx .github/workflows/tags-client-fallback.yml .github/scripts/tags-client-fallback.py
          git commit -m "fix: recover incomplete AI tag generations in UI" || true
          git push
