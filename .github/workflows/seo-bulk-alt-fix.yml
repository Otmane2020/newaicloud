name: Repair SEO bulk actions and ALT

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-bulk-alt-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Patch SEO navigation, bulk CTAs and ALT fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'pattern not found: {label}')
              return text.replace(old, new, 1)

          # 1) Sidebar: Content stays content-focused; SEO becomes a first-class section.
          p = Path('src/components/CatalogOptimizeSidebar.tsx')
          s = p.read_text()
          s = s.replace('  const pinnedContent: NavItem[] = useMemo(() => [\n    { label: "Tags", href: "/seo?tab=tags", icon: Tags },\n    { label: fr ? "ALT Images" : "Image ALT", href: "/seo?tab=alt", icon: Images },\n  ], [fr]);\n\n', '')
          s = s.replace('  Newspaper, Activity, Camera, Tags, Images\n', '  Newspaper, Activity, Camera, Tags, Images, Home\n')
          marker = '''    {\n      label: fr ? "Tarification" : "Pricing",\n'''
          seo_section = '''    {\n      label: "SEO",\n      icon: Sparkles,\n      items: [\n        {\n          label: fr ? "Collections & pages" : "Collections & pages",\n          href: "/seo?tab=collections",\n          icon: Layers3,\n          aliases: ["/seo?tab=pages"],\n        },\n        { label: "Tags", href: "/seo?tab=tags", icon: Tags },\n        { label: fr ? "ALT Images" : "Image ALT", href: "/seo?tab=alt", icon: Images },\n        { label: fr ? "SEO accueil" : "Homepage SEO", href: "/seo?tab=homepage", icon: Home },\n      ],\n    },\n'''
          s = replace_once(s, marker, seo_section + marker, 'insert SEO sidebar section')
          pinned_render = '''\n              {pinnedContent.map((item) => (\n                <SidebarMenuItem key={`pinned-${item.href}`}>\n                  <SidebarMenuButton asChild isActive={active(item)}>\n                    <NavLink to={item.href} onClick={closeMobile}>\n                      <item.icon className="h-4 w-4" />\n                      <span>{item.label}</span>\n                    </NavLink>\n                  </SidebarMenuButton>\n                </SidebarMenuItem>\n              ))}\n'''
          s = s.replace(pinned_render, '')
          p.write_text(s)

          # 2) SEO page heading: make SEO the main workspace.
          p = Path('src/pages/SEO.tsx')
          s = p.read_text()
          s = s.replace('section={fr ? "Contenu" : "Content"}\n        page={fr ? "Collections & pages" : "Collections & pages"}\n        title={fr ? "Collections & pages" : "Collections & pages"}', 'section="SEO"\n        page="SEO"\n        title="SEO"')
          s = s.replace('''? "Collections, pages, tags et ALT dans un espace simple et cohérent."\n          : "Collections, pages, tags, and ALT in one simple workspace."''', '''? "Optimisez collections, pages, tags, images ALT et page d’accueil depuis un seul espace."\n          : "Optimize collections, pages, tags, image ALT, and homepage SEO from one workspace."''')
          p.write_text(s)

          # 3) Metadata workspaces: visible Optimize All CTAs + robust batch/error handling + real content image type.
          p = Path('src/components/seo/MinimalMetadataWorkspaces.tsx')
          s = p.read_text()

          helper_marker = '''function EmptyState({ icon: Icon, text }: { icon: typeof Package; text: string }) {\n  return (\n    <div className="grid min-h-48 place-items-center p-8 text-center text-sm text-muted-foreground">\n      <div><Icon className="mx-auto mb-2 h-7 w-7 text-slate-300" />{text}</div>\n    </div>\n  );\n}\n'''
          helper_new = helper_marker + '''\nasync function runInBatches<T>(items: T[], worker: (item: T) => Promise<boolean>, batchSize = 4) {\n  let success = 0;\n  let failed = 0;\n  for (let index = 0; index < items.length; index += batchSize) {\n    const batch = items.slice(index, index + batchSize);\n    const results = await Promise.all(batch.map(async (item) => {\n      try { return await worker(item); } catch { return false; }\n    }));\n    success += results.filter(Boolean).length;\n    failed += results.filter((result) => !result).length;\n  }\n  return { success, failed };\n}\n'''
          s = replace_once(s, helper_marker, helper_new, 'batch helper')

          # Collections optimize handler
          old = '''  const optimize = async (ids: string[]) => {\n    if (!ids.length) return;\n    try {\n      setBusy(true);\n      let success = 0;\n      for (const id of ids) {\n        const { error } = await supabase.functions.invoke("generate-collection-seo", { body: { collection_ids: [id], force: true } });\n        if (!error) success += 1;\n      }\n      toast.success(fr ? `${success} collection(s) optimisée(s)` : `${success} collection(s) optimized`);\n      setSelected(new Set());\n      await load();\n    } finally { setBusy(false); }\n  };'''
          new = '''  const optimize = async (ids: string[]) => {\n    if (!ids.length) return;\n    try {\n      setBusy(true);\n      const result = await runInBatches(ids, async (id) => {\n        const { data, error } = await supabase.functions.invoke("generate-collection-seo", { body: { collection_ids: [id], force: true } });\n        return !error && data?.success !== false;\n      });\n      if (result.success) toast.success(fr ? `${result.success} collection(s) optimisée(s)` : `${result.success} collection(s) optimized`);\n      if (result.failed) toast.error(fr ? `${result.failed} collection(s) en échec` : `${result.failed} collection(s) failed`);\n      setSelected(new Set());\n      await load();\n    } finally { setBusy(false); }\n  };'''
          s = replace_once(s, old, new, 'collections optimize handler')
          old_toolbar = '''<span className="text-xs text-muted-foreground">{selected.size ? `${selected.size} sélectionnées` : `${filtered.length} collections`}</span>\n            <Button size="sm" disabled={!selected.size || busy} onClick={() => optimize([...selected])}>'''
          new_toolbar = '''<span className="text-xs text-muted-foreground">{selected.size ? `${selected.size} sélectionnées` : `${filtered.length} collections`}</span>\n            <Button size="sm" variant="outline" disabled={!missing || busy} onClick={() => optimize(items.filter((i) => !(i.optimization_count > 0)).map((i) => i.id))}><Sparkles className="mr-1.5 h-4 w-4" />{fr ? "Tout optimiser" : "Optimize All"}</Button>\n            <Button size="sm" disabled={!selected.size || busy} onClick={() => optimize([...selected])}>'''
          s = replace_once(s, old_toolbar, new_toolbar, 'collections optimize all CTA')

          # Pages handler and CTA
          old = '''  const optimize = async (ids: string[]) => { if (!ids.length) return; try { setBusy(true); let success = 0; for (const id of ids) { const { error } = await supabase.functions.invoke("generate-page-seo", { body: { pageId: id, storeId: selectedStore?.id, force: true } }); if (!error) success += 1; } toast.success(fr ? `${success} page(s) optimisée(s)` : `${success} page(s) optimized`); setSelected(new Set()); await load(); } finally { setBusy(false); } };'''
          new = '''  const optimize = async (ids: string[]) => { if (!ids.length) return; try { setBusy(true); const result = await runInBatches(ids, async (id) => { const { data, error } = await supabase.functions.invoke("generate-page-seo", { body: { pageId: id, storeId: selectedStore?.id, force: true } }); return !error && data?.success !== false; }); if (result.success) toast.success(fr ? `${result.success} page(s) optimisée(s)` : `${result.success} page(s) optimized`); if (result.failed) toast.error(fr ? `${result.failed} page(s) en échec` : `${result.failed} page(s) failed`); setSelected(new Set()); await load(); } finally { setBusy(false); } };'''
          s = replace_once(s, old, new, 'pages optimize handler')
          old = '''<span className="text-xs text-muted-foreground">{selected.size ? `${selected.size} sélectionnées` : `${filtered.length} pages`}</span><Button size="sm" disabled={!selected.size || busy} onClick={() => optimize([...selected])}>'''
          new = '''<span className="text-xs text-muted-foreground">{selected.size ? `${selected.size} sélectionnées` : `${filtered.length} pages`}</span><Button size="sm" variant="outline" disabled={!items.some((i) => !(i.optimization_count > 0)) || busy} onClick={() => optimize(items.filter((i) => !(i.optimization_count > 0)).map((i) => i.id))}><Sparkles className="mr-1.5 h-4 w-4" />{fr ? "Tout optimiser" : "Optimize All"}</Button><Button size="sm" disabled={!selected.size || busy} onClick={() => optimize([...selected])}>'''
          s = replace_once(s, old, new, 'pages optimize all CTA')

          # Tags handler and CTA
          old = '''  const generate = async (ids: string[]) => { if (!ids.length) return; try { setBusy(true); let success = 0; for (const id of ids) { const { data, error } = await supabase.functions.invoke("generate-tags", { body: { productId: id, force: true } }); if (!error && data?.success !== false) success += 1; } toast.success(fr ? `${success} produit(s) traité(s)` : `${success} product(s) processed`); setSelected(new Set()); await load(); } finally { setBusy(false); } };'''
          new = '''  const generate = async (ids: string[]) => { if (!ids.length) return; try { setBusy(true); const result = await runInBatches(ids, async (id) => { const { data, error } = await supabase.functions.invoke("generate-tags", { body: { productId: id, force: true } }); return !error && data?.success !== false; }); if (result.success) toast.success(fr ? `${result.success} produit(s) traité(s)` : `${result.success} product(s) processed`); if (result.failed) toast.error(fr ? `${result.failed} produit(s) en échec` : `${result.failed} product(s) failed`); setSelected(new Set()); await load(); } finally { setBusy(false); } };'''
          s = replace_once(s, old, new, 'tags generate handler')
          old = '''<span className="text-xs text-muted-foreground">{selected.size ? `${selected.size} sélectionnés` : `${filtered.length} produits`}</span><Button size="sm" disabled={!selected.size || busy} onClick={() => generate([...selected])}>'''
          new = '''<span className="text-xs text-muted-foreground">{selected.size ? `${selected.size} sélectionnés` : `${filtered.length} produits`}</span><Button size="sm" variant="outline" disabled={!missing || busy} onClick={() => generate(items.filter((i) => !optimized(i)).map((i) => i.id))}><Sparkles className="mr-1.5 h-4 w-4" />{fr ? "Tout optimiser" : "Optimize All"}</Button><Button size="sm" disabled={!selected.size || busy} onClick={() => generate([...selected])}>'''
          s = replace_once(s, old, new, 'tags optimize all CTA')

          # ALT: carry the real content type to smart-alt-text and report failures.
          s = s.replace('type AltItem = { id: string; src: string; alt_text: string | null; optimization_count: number | null; last_synced_at: string | null; imageType: "product" | "content"; title: string; subtitle: string };', 'type AltItem = { id: string; src: string; alt_text: string | null; optimization_count: number | null; last_synced_at: string | null; imageType: "product" | "collection" | "page" | "article" | "homepage" | "content"; title: string; subtitle: string };')
          s = s.replace('imageType: "content", title: row.content_type === "homepage"', 'imageType: (row.content_type || "content") as AltItem["imageType"], title: row.content_type === "homepage"')
          old = '''  const generate = async (targets: AltItem[]) => { if (!targets.length) return; try { setBusy(true); let success = 0; for (const item of targets) { const { data, error } = await supabase.functions.invoke("smart-alt-text", { body: { image_id: item.id, imageType: item.imageType, force: true } }); if (!error && data?.success !== false) success += 1; } toast.success(fr ? `${success} ALT généré(s)` : `${success} ALT text(s) generated`); setSelected(new Set()); await load(); } finally { setBusy(false); } };'''
          new = '''  const generate = async (targets: AltItem[]) => { if (!targets.length) return; try { setBusy(true); const failures: string[] = []; const result = await runInBatches(targets, async (item) => { const { data, error } = await supabase.functions.invoke("smart-alt-text", { body: { image_id: item.id, imageType: item.imageType, force: true } }); if (error || data?.success === false) { failures.push(data?.error || error?.message || item.title); return false; } return true; }, 3); if (result.success) toast.success(fr ? `${result.success} ALT généré(s)` : `${result.success} ALT text(s) generated`); if (result.failed) toast.error(fr ? `${result.failed} ALT en échec${failures[0] ? ` : ${failures[0]}` : ""}` : `${result.failed} ALT failed${failures[0] ? `: ${failures[0]}` : ""}`); setSelected(new Set()); await load(); } finally { setBusy(false); } };'''
          s = replace_once(s, old, new, 'ALT generate handler')
          old = '''<span className="text-xs text-muted-foreground">{selected.size ? `${selected.size} sélectionnées` : `${filtered.length} images`}</span><Button size="sm" disabled={!selected.size || busy} onClick={() => generate(items.filter((item) => selected.has(item.id)))}>'''
          new = '''<span className="text-xs text-muted-foreground">{selected.size ? `${selected.size} sélectionnées` : `${filtered.length} images`}</span><Button size="sm" variant="outline" disabled={!missing || busy} onClick={() => generate(items.filter((item) => !optimized(item)))}><Sparkles className="mr-1.5 h-4 w-4" />{fr ? "Tout optimiser" : "Optimize All"}</Button><Button size="sm" disabled={!selected.size || busy} onClick={() => generate(items.filter((item) => selected.has(item.id)))}>'''
          s = replace_once(s, old, new, 'ALT optimize all CTA')
          p.write_text(s)

          # 4) smart-alt-text: never fail completely just because external AI vision providers are unavailable.
          p = Path('supabase/functions/smart-alt-text/index.ts')
          s = p.read_text()
          insert_before = '''async function callDeepSeek(prompt: string): Promise<string> {'''
          fallback_fn = '''function buildSafeFallbackAlt(input: { lang: string; title: string; contentType: string; productType?: string; category?: string }): string {\n  const clean = (value = "") => value.replace(/<[^>]*>/g, " ").replace(/\\s+/g, " ").trim();\n  if (input.contentType === "homepage") {\n    return input.lang === "fr" ? "Accueil de la boutique en ligne" : "Online store homepage";\n  }\n  const parts = [clean(input.title), clean(input.productType), clean(input.category)]\n    .filter(Boolean)\n    .filter((value, index, values) => values.findIndex((other) => other.toLowerCase() === value.toLowerCase()) === index);\n  const fallback = cleanAltText(parts.join(" – "));\n  if (isUsefulAltText(fallback)) return fallback;\n  const labels: Record<string, string> = input.lang === "fr"\n    ? { product: "Produit de la boutique", collection: "Collection de produits", page: "Page de la boutique", article: "Article du blog", content: "Contenu de la boutique" }\n    : { product: "Store product", collection: "Product collection", page: "Store page", article: "Blog article", content: "Store content" };\n  return labels[input.contentType] || labels.content;\n}\n\n'''
          s = replace_once(s, insert_before, fallback_fn + insert_before, 'ALT fallback function')
          old = '''        } else {\n          throw geminiError;\n        }'''
          new = '''        } else {\n          provider = "safe-fallback";\n          finalAlt = buildSafeFallbackAlt({ lang, title, contentType, productType, category });\n          console.warn("[smart-alt-text] Gemini/DeepSeek unavailable; using safe contextual fallback:", geminiError);\n        }'''
          s = replace_once(s, old, new, 'ALT final provider fallback')
          p.write_text(s)

          # Remove this one-shot workflow after it has patched the repository.
          Path('.github/workflows/seo-bulk-alt-fix.yml').unlink()
          PY

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Commit repaired SEO workspace
        run: |
          git config user.name "Otmane2020"
          git config user.email "61626050+Otmane2020@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair ALT generation and SEO bulk actions"
          git push
