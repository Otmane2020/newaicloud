name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:

concurrency:
  group: supabase-edge-functions-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: jdndecpwuasguswsvtbn
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check deployment credentials
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing repository secret SUPABASE_ACCESS_TOKEN"
            echo "Add it in GitHub > Settings > Secrets and variables > Actions, then rerun this workflow."
            exit 1
          fi

      - name: Deploy all Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          echo "Deploying every Edge Function under supabase/functions to $PROJECT_REF"
          supabase functions deploy --project-ref "$PROJECT_REF" --use-api

      - name: Deployment summary
        run: echo "All repository Edge Functions deployed to Supabase project $PROJECT_REF"
