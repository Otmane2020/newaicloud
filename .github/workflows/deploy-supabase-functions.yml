name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:

concurrency:
  group: supabase-edge-functions-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: xkrrcusvmxifbiejxker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check deployment credentials
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing repository secret SUPABASE_ACCESS_TOKEN"
            echo "Add it in GitHub > Settings > Secrets and variables > Actions, then rerun this workflow."
            exit 1
          fi

      - name: Deploy catalog and automation functions
        shell: bash
        run: |
          set -euo pipefail
          for fn in \
            scheduled-sync \
            import-products \
            import-shopify-collections \
            import-shopify-pages \
            import-shopify-articles \
            generate-page-seo \
            export-creative-image \
            generate-ai-product-images \
            generate-aeo-plan \
            process-blog-campaigns
          do
            echo "Deploying $fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
          done

      - name: Deploy Stripe billing and credit functions
        shell: bash
        run: |
          set -euo pipefail
          for fn in \
            create-checkout \
            force-payment \
            calculate-proration \
            create-upgrade-invoice \
            update-subscription \
            sync-stripe-subscription \
            customer-portal \
            create-credit-checkout \
            verify-credit-checkout \
            stripe-credit-webhook \
            stripe-webhook
          do
            echo "Deploying $fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
          done

      - name: Deployment summary
        run: echo "Catalog, automation, Stripe subscription, upgrade and credit top-up functions deployed to Supabase project $PROJECT_REF"
