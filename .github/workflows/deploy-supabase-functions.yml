name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:

concurrency:
  group: supabase-edge-functions-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: xkrrcusvmxifbiejxker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check deployment credentials
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing repository secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi

      - name: Deploy generate-page-seo
        run: supabase functions deploy generate-page-seo --project-ref "$PROJECT_REF"

      - name: Deploy import-shopify-collections
        run: supabase functions deploy import-shopify-collections --project-ref "$PROJECT_REF"

      - name: Deploy export-creative-image
        run: supabase functions deploy export-creative-image --project-ref "$PROJECT_REF"

      - name: Deploy generate-ai-product-images
        run: supabase functions deploy generate-ai-product-images --project-ref "$PROJECT_REF"

      - name: Deploy generate-aeo-plan
        run: supabase functions deploy generate-aeo-plan --project-ref "$PROJECT_REF"

      - name: Deploy process-blog-campaigns
        run: supabase functions deploy process-blog-campaigns --project-ref "$PROJECT_REF"

      - name: Deployment summary
        run: echo "SEO, Shopify collections, creative image, Product Shot AI and GEO automation functions deployed to Supabase project $PROJECT_REF"
