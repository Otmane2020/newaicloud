name: Validate Shopify OAuth fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-shopify-articles-residue.yml

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Remove stale article OAuth residue
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/functions/import-shopify-articles/index.ts')
          source = path.read_text()
          old = """    if (!accessToken) {
                  accessToken = connection.access_token;
                  console.log('✅ [ARTICLES] Using OAuth token from database (length:', accessToken?.length, ')');
                }
                
                console.log('✅ [ARTICLES] Shop name extracted from database:', shopName);
              }
              
              if (!accessToken) {
          """
          # Normalize indentation in the literal so it matches the current file exactly.
          old = old.replace('              accessToken', '        accessToken').replace('              console.log', '        console.log').replace('            }\n            \n            console.log', '      }\n      \n      console.log').replace('          }\n          \n          if (!accessToken)', '    }\n    \n    if (!accessToken)')
          # Prefer an exact explicit fallback matching the current file.
          exact = """    if (!accessToken) {
                  accessToken = connection.access_token;
                  console.log('✅ [ARTICLES] Using OAuth token from database (length:', accessToken?.length, ')');
                }
                
                console.log('✅ [ARTICLES] Shop name extracted from database:', shopName);
              }
              
              if (!accessToken) {
          """
          exact = exact.replace('        accessToken', '        accessToken')
          # Safer marker-based removal: the stale block starts immediately after the authoritative OAuth block.
          stale_start = source.find("    if (!accessToken) {\n        accessToken = connection.access_token;\n        console.log('✅ [ARTICLES] Using OAuth token from database (length:', accessToken?.length, ')');")
          if stale_start == -1:
              raise SystemExit('Stale article OAuth residue not found; refusing broad edit')
          real_if = source.find('    if (!accessToken) {\n      return new Response(', stale_start)
          if real_if == -1:
              raise SystemExit('Real post-OAuth accessToken guard not found')
          source = source[:stale_start] + source[real_if:]
          source = source.replace('      \n        if (blogsResponse.status === 401) {', '      \n      if (blogsResponse.status === 401) {', 1)
          path.write_text(source)
          PY

          git diff --check

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check patched Edge Functions
        run: |
          deno check supabase/functions/import-products/index.ts
          deno check supabase/functions/import-shopify-articles/index.ts

      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/import-shopify-articles/index.ts
          git commit -m "Validate Shopify OAuth 401 article import fix"
          git push origin HEAD:main