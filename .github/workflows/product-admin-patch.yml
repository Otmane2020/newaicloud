name: Product admin editor patch
on:
  push:
    paths:
      - scripts/patch_product_inline.py
      - .github/workflows/product-admin-patch.yml
permissions:
  contents: write
jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: python scripts/patch_product_inline.py
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Build
        run: npm run build
      - name: Cleanup temporary patch files
        run: rm -f scripts/patch_product_inline.py .github/workflows/product-admin-patch.yml
      - name: Commit changes
        run: |
          git config user.name "catalog-optimize-bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: make product commerce fields editable"
          git push
