name: Temporary i18n and build audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/i18n-audit-build.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Build
        run: npm run build
      - name: French UI residue audit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('src/components'), Path('src/pages')]
          french = re.compile(r"\b(Prévisualisation|Sélectionnez|Sélectionner|Annuler|Appliquer|Régénérer|Génération|Erreur|Image principale|Image secondaire|Fond blanc|Arrière-plan|Télécharger|Synchroniser|Variante|Galerie|Résolution|Produits|Historique|Paramètres|Enregistrer|Supprimer|Fermer|Continuer|Ajouter|Modifier|Chargement|Réessayer|Référence|Aucune|Aucun|Toutes|Tous|Choisir|Description courte|Nom du style)\b", re.I)
          hits = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*.tsx'):
                  for lineno, line in enumerate(path.read_text(errors='ignore').splitlines(), 1):
                      if french.search(line):
                          hits.append((str(path), lineno, line.strip()))
          print(f'I18N_AUDIT_HITS={len(hits)}')
          for path, lineno, line in hits[:700]:
              print(f'{path}:{lineno}: {line}')
          PY
