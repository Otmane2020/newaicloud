# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration
# IMPORTANT: Replace with your actual AI Images app client_id from Shopify Partner Dashboard
# Then run: shopify app deploy --config=shopify.ai-images.app.toml

client_id = "YOUR_AI_IMAGES_CLIENT_ID"

name = "AI Product Image Shot"

application_url = "https://nekqqlhrjgmyudmmewas.supabase.co/functions/v1/ai-images-shopify-install"

embedded = true

[build]

automatically_update_urls_on_dev = true

[webhooks]

api_version = "2025-10"

  # App lifecycle webhooks

  [[webhooks.subscriptions]]

  topics = [ "app/uninstalled" ]

  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]

  topics = [ "app/scopes_update" ]

  uri = "/webhooks/app/scopes_update"

  # ✅ Mandatory GDPR compliance webhooks

  [[webhooks.subscriptions]]

  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]

  uri = "https://nekqqlhrjgmyudmmewas.supabase.co/functions/v1/ai-images-gdpr-webhook"

[access_scopes]

# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes

scopes = "read_products,write_products,read_files,write_files"

optional_scopes = []

use_legacy_install_flow = false

[auth]

redirect_urls = [

  "https://nekqqlhrjgmyudmmewas.supabase.co/functions/v1/ai-images-shopify-oauth",

  "https://ai-images.newai.sale/setup"

]
