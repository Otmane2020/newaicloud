# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration
# AI Product Image Shot - Separate Shopify App

client_id = "YOUR_AI_IMAGES_CLIENT_ID"
name = "AI Product Image Shot"
application_url = "https://ai-images.newai.sale"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2025-10"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "https://nekqqlhrjgmyudmmewas.supabase.co/functions/v1/ai-images-gdpr-webhook"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "https://nekqqlhrjgmyudmmewas.supabase.co/functions/v1/ai-images-gdpr-webhook"

[access_scopes]
scopes = "read_products,write_products,read_files,write_files"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://nekqqlhrjgmyudmmewas.supabase.co/functions/v1/ai-images-shopify-oauth"
]
