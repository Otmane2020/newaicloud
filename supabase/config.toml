# Edge Functions are deployed from GitHub Actions on changes under supabase/functions/.
# Stripe calls webhook endpoints directly, so Supabase JWT verification must be disabled.
[functions.stripe-credit-webhook]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

# Google redirects back without a Supabase JWT. The function performs its own auth
# for start/status/disconnect and validates a single-use OAuth state on callback.
[functions.google-business-oauth]
verify_jwt = false

